[project]
name = "gliner25-context-compaction"
version = "0.1.0"
description = "Verbatim context compaction with GLiNER2.5 classification and evidence spans"
authors = [
    { name = "Mary", email = "mary@fastino.ai" }
]
requires-python = ">=3.11"
dependencies = [
    "gliner2[local]>=2.0.0",
    "protobuf>=7.36.2",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
