[project]
name = "gliner25-context-compaction"
version = "0.1.0"
description = "Verbatim context compaction with GLiNER2.5 classification and evidence spans"
authors = [
    { name = "Mary Newhauser" }
]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "gliner2[local]>=2.0.0",
    "protobuf>=7.36.2",
]

[project.urls]
Repository = "https://github.com/m-newhauser/gliner25-compaction"
Issues = "https://github.com/m-newhauser/gliner25-compaction/issues"

[build-system]
requires = ["uv_build>=0.11.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
